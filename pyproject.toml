[project]
name = "terminal_maimemo"
version = "0.1.0"
description = "终端版墨墨背单词（web-study TUI client）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "miniaudio>=1.71",
    "textual>=8.2.8",
    "websockets>=17.0.1",
]

[project.scripts]
terminal_maimemo = "terminal_maimemo:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "protobuf>=7.35.1",
]
